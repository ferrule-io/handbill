name: handbill
# Local dependencies for development. The server itself runs on the host
# (`make run`); see mise.toml for the matching environment.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: handbill
      POSTGRES_PASSWORD: handbill
      POSTGRES_DB: handbill
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handbill -d handbill"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Go tests (internal/db/dbtest) create, migrate, and drop a database per
  # test. On the dev instance that churn (WAL and checkpoints for every
  # CREATE/DROP DATABASE) starved the server under test: Playwright timed
  # out while `go test` ran, and dbtest's own drops timed out under load.
  # A separate throwaway instance without durability keeps them apart.
  postgres-test:
    image: postgres:17
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: handbill
      POSTGRES_PASSWORD: handbill
      POSTGRES_DB: handbill
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handbill -d handbill"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles:
      - storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    profiles:
      - storage
    command: -scheme http -port 4443 -public-host 127.0.0.1:4443 -external-url http://127.0.0.1:4443
    ports:
      - "127.0.0.1:4443:4443"
volumes:
  postgres:
