name: CI

on:
  push:
    branches: [development]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet and test
    runs-on: ubuntu-latest
    services:
      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data
      fake-gcs:
        image: fsouza/fake-gcs-server:latest
        ports:
          - 4443:4443
        command: -scheme http -port 4443 -public-host 127.0.0.1:4443 -external-url http://127.0.0.1:4443
      # The oldest PostgreSQL the schema supports (the Helm chart bundles 17).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentdash
          POSTGRES_PASSWORD: agentdash
          POSTGRES_DB: agentdash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentdash -d agentdash"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://agentdash:agentdash@127.0.0.1:5432/agentdash?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generated code is current
        run: |
          sqlc generate -f internal/db/sqlc.yaml
          git add -N internal/db
          git diff --exit-code -- internal/db
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          TEST_GCS_EMULATOR_HOST: 127.0.0.1:4443

  web:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    name: Image build and acceptance
    runs-on: ubuntu-latest
    services:
      # The server applies migrations at startup and exits without a database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handbill
          POSTGRES_PASSWORD: handbill
          POSTGRES_DB: handbill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handbill -d handbill"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: handbill:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        # /data is a host directory, and the container runs as the runner's
        # user, so the e2e seeder (internal/sites/e2eseed) writes site blobs
        # where the container's local storage reads and writes them.
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name handbill --network host \
            --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/data:/data" \
            -e APP_ORIGIN=http://dash.localhost:8080 \
            -e SITES_DOMAIN=sites.localhost \
            -e SECRET_KEY="$(openssl rand -base64 48)" \
            -e DATABASE_URL='postgres://handbill:handbill@127.0.0.1:5432/handbill?sslmode=disable' \
            handbill:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs handbill
          exit 1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Acceptance checks (Playwright)
        working-directory: web
        env:
          BASE_URL: http://dash.localhost:8080
          SITES_DOMAIN: sites.localhost
          # The seeder uses the container's database and storage.
          DATABASE_URL: postgres://handbill:handbill@127.0.0.1:5432/handbill?sslmode=disable
          STORAGE_TYPE: local
          STORAGE_LOCAL_DIR: ${{ runner.temp }}/data
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Container logs
        if: failure()
        run: docker logs handbill
