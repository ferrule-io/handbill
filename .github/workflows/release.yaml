name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Serializes main releases so a queued run sees the previous run's tag. The
# name must not start with "release": the called CI workflow's group is
# "Release-<ref>" and group names are case-insensitive.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  version:
    name: Compute release version
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      minor: ${{ steps.next.outputs.minor }}
      publish: ${{ steps.next.outputs.publish }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Next patch version
        id: next
        # Pushes to main publish; workflow_dispatch (any branch) is a dry run.
        # The bump uses every repo tag so a version is never reused.
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          latest=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<<"${latest#v}"
          version="${major}.${minor}.$((patch + 1))"
          publish=false
          [ "$GITHUB_EVENT_NAME" = push ] && publish=true
          skip=false
          head_tag=$(git tag --points-at HEAD | grep -E "$semver" | sort -V | tail -n1 || true)
          if [ "$publish" = true ] && [ -n "$head_tag" ]; then
            echo "::notice::${GITHUB_SHA} is already released as ${head_tag}; nothing to publish"
            skip=true
          fi
          echo "Latest tag ${latest}; next version ${version}; publish=${publish}; skip=${skip}"
          {
            echo "version=${version}"
            echo "minor=${major}.${minor}"
            echo "publish=${publish}"
            echo "skip=${skip}"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build and push container image
    needs: version
    if: ${{ needs.version.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        # v4.4.0
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        # v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: ${{ needs.version.outputs.publish == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        # v6.2.0
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/ferrule-io/handbill
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=latest,enable=${{ needs.version.outputs.publish == 'true' }}
            type=raw,value=dry-run,enable=${{ needs.version.outputs.publish != 'true' }}

      - name: Build and push image
        # v7.4.0
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # handbill --version, the startup log, and the MCP server version.
          build-args: |
            VERSION=v${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build provenance attestation
        # v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: ${{ needs.version.outputs.publish == 'true' }}
        with:
          subject-name: ghcr.io/ferrule-io/handbill
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
  chart:
    name: Package and push Helm chart
    needs: [version, image]
    if: ${{ needs.version.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      chart-package: ${{ steps.package.outputs.package_path }}
      chart-version: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Helm
        # v5.1.0
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e

      - name: Update Chart.yaml version and appVersion
        run: |
          sed -i.bak -E "s/^version:.*/version: ${{ needs.version.outputs.version }}/" deploy/helm/handbill/Chart.yaml
          sed -i.bak -E "s/^appVersion:.*/appVersion: \"${{ needs.version.outputs.version }}\"/" deploy/helm/handbill/Chart.yaml
          rm -f deploy/helm/handbill/Chart.yaml.bak
          git diff deploy/helm/handbill/Chart.yaml

      - name: Helm lint
        run: |
          helm lint deploy/helm/handbill

      - name: Helm package
        id: package
        run: |
          mkdir -p .cr-release-packages
          helm package deploy/helm/handbill --destination .cr-release-packages
          PKG_PATH=$(find .cr-release-packages -name "handbill-*.tgz" -print -quit)
          echo "package_path=${PKG_PATH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        # v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: ${{ needs.version.outputs.publish == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify default chart images resolve
        # The pushed chart must install as-is: every image its default
        # values render has to exist in its registry.
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          PKG_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          mapfile -t refs < <(helm template handbill "$PKG_PATH" \
            | sed -nE 's/^[[:space:]]*(- )?image:[[:space:]]*"?([^"[:space:]]+)"?.*$/\2/p' | sort -u)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no image references rendered from $PKG_PATH"
            exit 1
          fi
          failed=0
          for ref in "${refs[@]}"; do
            echo "Checking $ref"
            if ! docker buildx imagetools inspect "$ref" > /dev/null; then
              echo "::error::chart default image does not resolve: $ref"
              failed=1
            fi
          done
          exit "$failed"

      - name: Push Helm chart to GHCR OCI registry
        if: ${{ needs.version.outputs.publish == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.package_path }}" oci://ghcr.io/ferrule-io/charts

      - name: Upload chart package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-package
          path: ${{ steps.package.outputs.package_path }}

  github-release:
    name: Create GitHub Release
    needs: [version, chart]
    runs-on: ubuntu-latest
    if: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.skip != 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download chart package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-package

      - name: Create GitHub Release
        # v3.0.4
        # Creates tag vX.Y.Z at the built commit, only after image and chart
        # are published.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            *.tgz
