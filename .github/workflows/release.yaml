name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build but do not push)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU
        # v3.6.0
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        # v3.10.0
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Log in to GitHub Container Registry
        # v3.3.0
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        # v5.7.0
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/ferrule-io/handbill
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Build and push image
        # v6.15.0
        id: build-push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # handbill --version, the startup log, and the MCP server version.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build provenance attestation
        # v2.4.0
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        with:
          subject-name: ghcr.io/ferrule-io/handbill
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
  chart:
    name: Package and push Helm chart
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      chart-package: ${{ steps.package.outputs.package_path }}
      chart-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Helm
        # v4.3.0
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112

      - name: Determine chart and app version
        id: version
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            VER="${BASH_REMATCH[1]}"
          else
            VER="0.0.0-dryrun"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version and appVersion
        run: |
          sed -i.bak -E "s/^version:.*/version: ${{ steps.version.outputs.version }}/" deploy/helm/handbill/Chart.yaml
          sed -i.bak -E "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" deploy/helm/handbill/Chart.yaml
          rm -f deploy/helm/handbill/Chart.yaml.bak
          git diff deploy/helm/handbill/Chart.yaml

      - name: Helm lint
        run: |
          helm lint deploy/helm/handbill

      - name: Helm package
        id: package
        run: |
          mkdir -p .cr-release-packages
          helm package deploy/helm/handbill --destination .cr-release-packages
          PKG_PATH=$(find .cr-release-packages -name "handbill-*.tgz" -print -quit)
          echo "package_path=${PKG_PATH}" >> "$GITHUB_OUTPUT"

      - name: Push Helm chart to GHCR OCI registry
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.package_path }}" oci://ghcr.io/ferrule-io/charts

      - name: Upload chart package artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: helm-package
          path: ${{ steps.package.outputs.package_path }}

  github-release:
    name: Create GitHub Release
    needs: chart
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - name: Download chart package artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: helm-package

      - name: Create GitHub Release
        # v2.2.1
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          generate_release_notes: true
          files: |
            *.tgz
