# Default values for agent-dash.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of agent-dash replicas.
# NOTE: If replicaCount > 1 and storage.type is "local", persistence.accessModes
# must include ReadWriteMany (RWX), or use s3 / gcs storage.
replicaCount: 1

image:
  # Container image repository (no invented registry)
  repository: agent-dash
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account (e.g. for AWS IRSA or GCP Workload Identity)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

# Application domain and origin configuration
app:
  # Origin for the main application UI, auth, OAuth, and /mcp
  origin: "https://dash.example.com"
  # Base domain for hosted sites: sites are served on <site-id>.<sitesDomain>
  sitesDomain: "sites.example.com"

# Application secret key configuration (HMAC signing, min 32 bytes)
secretKey:
  # Use an existing Secret containing the secret key
  existingSecret: ""
  # Key within existingSecret (defaults to secret-key)
  existingSecretKey: "secret-key"
  # Optional explicit secret key value (if not set and existingSecret not set, one is generated)
  value: ""

# Bundled PostgreSQL configuration (official postgres image, single-instance StatefulSet)
postgresql:
  # When true, deploys a bundled single-instance PostgreSQL StatefulSet with a PVC
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: agent_dash
    username: agent_dash
    # Explicit password (if empty and existingSecret is unset, a random password is generated via lookup)
    password: ""
    # Use an existing Secret for the PostgreSQL password
    existingSecret: ""
    existingSecretPasswordKey: "password"
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  podSecurityContext:
    fsGroup: 999
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# External PostgreSQL database configuration (used when postgresql.enabled is false)
externalDatabase:
  # Database hostname or IP
  host: ""
  # Database port
  port: 5432
  # Database name
  database: ""
  # Database username
  user: ""
  # Database password (if not using existingSecret)
  password: ""
  # SSL mode: disable, require, verify-ca, verify-full, prefer
  sslmode: "prefer"
  # Existing secret containing database credentials or a full DSN
  existingSecret: ""
  # Key within existingSecret containing the database password
  existingSecretPasswordKey: "password"
  # Key within existingSecret containing a full DATABASE_URL DSN (e.g. postgres://user:pass@host:5432/db)
  existingSecretDsnKey: ""

# Storage adapter configuration (local, s3, or gcs)
storage:
  # Storage type: "local", "s3", or "gcs"
  type: "local"

  # Local filesystem storage settings (requires persistence.enabled=true)
  local:
    dir: "/data"

  # AWS S3 (or S3-compatible) storage settings
  s3:
    bucket: ""
    region: ""
    endpoint: ""
    prefix: ""
    forcePathStyle: false
    # Existing Secret containing AWS credentials (AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY)
    # If unset, AWS IRSA or pod credentials will be used
    existingSecret: ""
    accessKeyIdKey: "AWS_ACCESS_KEY_ID"
    secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"

  # Google Cloud Storage settings
  gcs:
    bucket: ""
    prefix: ""
    # Existing Secret containing GCP service account key JSON
    # If unset, GCP Workload Identity will be used
    existingSecret: ""
    keyFileKey: "service-account-key.json"
    mountPath: "/etc/gcp"

# Persistence configuration for "local" storage adapter
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # Example cert-manager DNS-01 configuration for wildcard domain:
    # cert-manager.io/cluster-issuer: letsencrypt-dns01
  tls: []
    # - secretName: agent-dash-tls
    #   hosts:
    #     - dash.example.com
    # - secretName: agent-dash-sites-tls
    #   hosts:
    #     - "*.sites.example.com"

# SMTP configuration for email notifications and verification (optional)
smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "password"
  from: ""
  # TLS mode: "starttls", "tls", or "none"
  tls: "starttls"

# Google OIDC sign-in configuration (optional)
google:
  clientId: ""
  # Existing secret containing GOOGLE_CLIENT_SECRET
  existingSecret: ""
  existingSecretClientSecretKey: "GOOGLE_CLIENT_SECRET"

# OAuth 2.1 configuration
oauth:
  # Enable Dynamic Client Registration (RFC 7591) at /oauth/register
  dcrEnabled: false

# Invite and ownership transfer token time-to-live (Go duration string)
inviteTTL: "336h"

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraEnvFrom: []
