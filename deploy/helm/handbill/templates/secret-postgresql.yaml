{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-dash.postgresqlSecretName" . }}
  labels:
    {{- include "agent-dash.postgresqlLabels" . | nindent 4 }}
type: Opaque
data:
  {{ include "agent-dash.postgresqlSecretPasswordKey" . }}: {{ include "agent-dash.postgresqlPassword" . | b64enc | quote }}
{{- end }}
