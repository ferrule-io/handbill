{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "handbill.postgresqlSecretName" . }}
  labels:
    {{- include "handbill.postgresqlLabels" . | nindent 4 }}
type: Opaque
data:
  {{ include "handbill.postgresqlSecretPasswordKey" . }}: {{ include "handbill.postgresqlPassword" . | b64enc | quote }}
{{- end }}
