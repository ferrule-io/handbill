{{- if not .Values.secretKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-dash.secretKeySecretName" . }}
  labels:
    {{- include "agent-dash.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "agent-dash.secretKeyKey" . }}: {{ include "agent-dash.secretKeyValue" . | b64enc | quote }}
{{- end }}
{{- if and .Values.smtp.enabled (not .Values.smtp.existingSecret) .Values.smtp.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-dash.smtpSecretName" . }}
  labels:
    {{- include "agent-dash.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "agent-dash.smtpSecretPasswordKey" . }}: {{ .Values.smtp.password | b64enc | quote }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-dash.externalDatabaseSecretName" . }}
  labels:
    {{- include "agent-dash.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "agent-dash.externalDatabaseSecretPasswordKey" . }}: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
