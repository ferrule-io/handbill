{{- if not .Values.secretKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "handbill.secretKeySecretName" . }}
  labels:
    {{- include "handbill.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "handbill.secretKeyKey" . }}: {{ include "handbill.secretKeyValue" . | b64enc | quote }}
{{- end }}
{{- if and .Values.smtp.enabled (not .Values.smtp.existingSecret) .Values.smtp.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "handbill.smtpSecretName" . }}
  labels:
    {{- include "handbill.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "handbill.smtpSecretPasswordKey" . }}: {{ .Values.smtp.password | b64enc | quote }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "handbill.externalDatabaseSecretName" . }}
  labels:
    {{- include "handbill.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "handbill.externalDatabaseSecretPasswordKey" . }}: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
